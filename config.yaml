data:
  raw_path: "data/raw/train_transaction.csv"
  processed_path: "data/processed/features.parquet"
  test_size: 0.2
  val_size: 0.1
  random_seed: 42
  target_column: "isFraud"

model:
  save_path: "models/xgb_fraud_model.pkl"
  threshold: 0.5
  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    scale_pos_weight: 10

api:
  host: "0.0.0.0"
  port: 8000
  model_path: "models/xgb_fraud_model.pkl"

logging:
  level: "INFO"
  log_file: "logs/app.log"